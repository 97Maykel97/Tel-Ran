<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Registration Form</title>
		<link rel="stylesheet" href="./src/css/style.css" />
	</head>
	<body>
		<main class="page-shell">
			<form class="registration-form" action="" method="get">
				<fieldset>
					<legend>Registration form</legend>
					<p class="form-note"><span>*</span> Required fields</p>

					<div class="fields-wrap">
						<div class="field">
							<label for="fName">First name:*</label>
							<input
								id="fName"
								name="fName"
								type="text"
								placeholder="Enter your first name"
								pattern="[A-Za-z]{3,15}"
								title="Enter 3–15 English letters"
								autocomplete="given-name"
								required
							/>
						</div>

						<div class="field">
							<label for="lName">Last name:*</label>
							<input
								id="lName"
								name="lName"
								type="text"
								placeholder="Enter your last name"
								pattern="[A-Za-z]{3,20}"
								title="Enter 3–20 English letters"
								autocomplete="family-name"
								required
							/>
						</div>

						<div class="field">
							<label for="email">Email:*</label>
							<input
								id="email"
								name="email"
								type="email"
								placeholder="example@gmail.com"
								pattern="[A-Za-z0-9._%+-]+@gmail\.com"
								title="Enter a Gmail address, for example: example@gmail.com"
								autocomplete="email"
								required
							/>
						</div>

						<div class="field">
							<label for="phone">Phone:*</label>
							<input
								id="phone"
								name="phone"
								type="tel"
								placeholder="+972501234567"
								pattern="\+9725[0-9]{8}"
								title="Enter a phone number in the format +972501234567"
								autocomplete="tel"
								required
							/>
						</div>

						<div class="field">
							<label for="language">Language:*</label>
							<select id="language" name="language" required>
								<option value="" selected disabled>Choose a language</option>
								<option value="en">English</option>
								<option value="he">Hebrew</option>
								<option value="ru">Russian</option>
							</select>
						</div>

						<div class="field">
							<p class="field-label">Gender:*</p>
							<div class="choice-group">
								<label class="choice-card"
									><input
										type="radio"
										name="gender"
										value="male"
										required
									/><span>Male</span></label
								>
								<label class="choice-card"
									><input
										type="radio"
										name="gender"
										value="female"
										required
									/><span>Female</span></label
								>
							</div>
						</div>

						<div class="field">
							<label for="birthDate">Date of birth:*</label>
							<input id="birthDate" name="birthDate" type="date" required />
						</div>

						<div class="terms">
							<label class="check-label">
								<input type="checkbox" name="terms" value="accepted" required />
								<span>I agree to the <a href="#">terms and conditions</a></span>
							</label>
						</div>
					</div>

					<div class="form-actions">
						<button class="button button--secondary" type="reset">Clear</button>
						<button class="button button--primary" type="submit">
							Create account <span>→</span>
						</button>
					</div>
				</fieldset>
			</form>
		</main>
	</body>
</html>
