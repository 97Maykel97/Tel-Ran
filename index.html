<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./src/css/style.css" />
		<title>Olympic Rings</title>
	</head>
	<body>
		<div class="container">
			<h1 class="title">Olympic Rings</h1>

			<div class="olympic__rings">
				<div class="ring ring--blue">
					<img
						src="./src/assets/images/continents/Europe.png"
						alt="Blue silhouette of Europe"
						class="olympic__rings-img"
					/>
				</div>

				<div class="ring ring--black">
					<img
						src="./src/assets/images/continents/Africa.png"
						alt="Black silhouette of Africa"
						class="olympic__rings-img"
					/>
				</div>

				<div class="ring ring--red">
					<img
						src="./src/assets/images/continents/America.png"
						alt="Red silhouette of North and South America"
						class="olympic__rings-img"
					/>
				</div>

				<div class="ring ring--yellow">
					<img
						src="./src/assets/images/continents/Asia.png"
						alt="Yellow silhouette of Asia"
						class="olympic__rings-img"
					/>
				</div>

				<div class="ring ring--green">
					<img
						src="./src/assets/images/continents/Oceania.png"
						alt="Green silhouette of Australia and Oceania"
						class="olympic__rings-img"
					/>
				</div>
			</div>
		</div>
	</body>
</html>
